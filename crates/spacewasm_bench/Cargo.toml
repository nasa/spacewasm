[package]
name = "spacewasm_bench"

version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
spacewasm = { path = "../.." }

[target.'cfg(not(target_os = "none"))'.dependencies]
spacewasm_util = { path = "../spacewasm_util" }

[target.'cfg(any(target_arch = "riscv64", target_arch = "riscv32"))'.dependencies]
riscv = { version = "0.16.1", features = ["critical-section-single-hart"] }
riscv-rt = "0.18.0"
semihosting = { version = "0.1.25", features = ["stdio", "panic-handler"] }
embedded-alloc = "0.7.0"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
rtic-monotonics = { version = "2.2.1", features = ["cortex-m-systick"] }
semihosting = { version = "0.1.25", features = ["stdio", "panic-handler"] }
embedded-alloc = "0.7.0"

