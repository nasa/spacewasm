[package]
name = "spacewasm_tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ground tooling for the spacewasm interpreter: link with wasm-opt held to its features, validate, run WASI modules, trace execution, split debug info into a symbol file, and resolve backtraces"
readme = "README.md"
keywords = ["wasm", "webassembly", "linker", "dwarf", "backtrace"]
categories = ["wasm", "command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "spacewasm"
path = "src/bin/spacewasm/main.rs"
# `clap`, and `run`'s WASI host, are only the binary's: a library user (a tool that is
# Cargo's linker itself) should not compile them.
required-features = ["bin"]

[features]
default = ["bin"]
bin = ["dep:clap", "dep:wasi-common", "dep:wiggle", "dep:crossterm"]
# Bounds-check every interpreter stack and IR access, so `trace` stops at the fault in a
# module that corrupts the interpreter rather than after it. What `make trace` uses.
strict-assertions = ["spacewasm/strict-assertions"]

[dependencies]
# The IR map replays the flight compiler, so this has to be the same `spacewasm`
# that flies, with the ground-only hook switched on.
spacewasm = { path = "../..", version = "=0.0.0", features = ["ir-map"] }
addr2line = { version = "0.25.1", default-features = false, features = ["rustc-demangle", "std"] }
gimli = { version = "0.32.3", default-features = false, features = ["read", "endian-reader", "std"] }
wasmparser = { version = "0.259", default-features = false, features = ["validate"] }
wasm-encoder = { version = "0.259", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
clap = { version = "4.6.1", features = ["derive"], optional = true }
wasi-common = { version = "28.0.1", default-features = false, features = ["sync"], optional = true }
wiggle = { version = "28.0.1", default-features = false, optional = true }
crossterm = { version = "0.29.0", default-features = false, features = ["windows"], optional = true }

[dev-dependencies]
wat = { version = "1.259.0", features = ["dwarf"] }
assert_cmd = "2.0.14"
predicates = "3.1.0"
wasmprinter = "0.259"

[lints]
workspace = true
