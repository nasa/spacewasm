[package]
name = "spacewasm-fuzzing"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spacewasm = { path = "../..", features = ["strict-assertions"] }
arbitrary = { version = "1", features = ["derive"] }
log = "0.4"
wasm-smith = "0.220.0"
wasmprinter = "0.220.0"
env_logger = "0.11"
wasmi = { version = "=1.1.0", optional = true }

[features]
# On by default so `cargo test --workspace` runs the differential oracle tests.
# `spacewasm-fuzzing` is `publish = false` dev tooling and nothing in the
# workspace depends on it, so this does not reach the interpreter or any
# shipped artifact.
default = ["differential"]
# Differential validator testing against wasmi as a reference implementation.
differential = ["dep:wasmi"]

[dev-dependencies]
wat = "1"
