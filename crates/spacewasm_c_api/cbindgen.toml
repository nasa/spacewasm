language = "C"
include_guard = "SPACEWASM_H"
tab_width = 4
documentation_style = "c"
cpp_compat = true
no_includes = true
sys_includes = ["stdbool.h", "stdint.h", "stddef.h"]
# Render Rust `usize`/`isize` as `size_t`/`ptrdiff_t` rather than `uintptr_t`.
usize_is_size_t = true
header = """/*
 * spacewasm.h — C API for the SpaceWasm WebAssembly interpreter.
 * Generated by cbindgen
 */"""
after_includes = """

#if defined(__has_c_attribute)
#  if __has_c_attribute(noreturn)
#    define SPACEWASM_NORETURN [[noreturn]] /* Standard C23 attribute */
#  endif
#endif

#if !defined(SPACEWASM_NORETURN)
#  if defined(__STDC_VERSION__) && (__STDC_VERSION__ >= 201112L)
#    define SPACEWASM_NORETURN _Noreturn /* Standard C11 keyword */
#  elif defined(__GNUC__) || defined(__clang__)
#    define SPACEWASM_NORETURN __attribute__((noreturn)) /* GCC / Clang extension */
#  elif defined(_MSC_VER)
#    define SPACEWASM_NORETURN __declspec(noreturn) /* MSVC extension */
#  else
#    define SPACEWASM_NORETURN /* Fallback: do nothing on unsupported compilers */
#  endif
#endif"""

[export]
# `__spacewasm_*` are the heap-allocator symbols the core crate imports; they are
# provided internally, not part of the public C surface, so keep them out of the header.
exclude = [
    "JumpTarget",
    "__spacewasm_alloc",
    "__spacewasm_dealloc",
    "rust_eh_personality",
]

[export.rename]
"CAllocator" = "spacewasm_allocator_t"
"SpacewasmCaller" = "spacewasm_caller_t"
"CEngine" = "spacewasm_t"
"HostModule" = "spacewasm_host_module_t"

[parse]
parse_deps = true
include = ["spacewasm"]
