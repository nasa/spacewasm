[package]
name = "spacewasm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# The fuzzing crates form their own workspace, separate from the root one, so
# their dependencies (wasm-smith, wasmi, libfuzzer-sys, ...) are locked in
# `fuzz/Cargo.lock` and never pulled into the flight build.
[workspace]
members = [".", "fuzzing"]

[workspace.lints.clippy]
disallowed_methods = "allow"

[lints]
workspace = true

[dependencies]
libfuzzer-sys = "=0.4.13"
spacewasm = { path = "..", features = ["strict-assertions"] }
spacewasm-fuzzing = { path = "fuzzing", features = ["differential"] }

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate-differential"
path = "fuzz_targets/validate_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "no-traps"
path = "fuzz_targets/no_traps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "malformed"
path = "fuzz_targets/malformed.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[[bin]]
name = "exec-differential"
path = "fuzz_targets/exec_differential.rs"
test = false
doc = false
bench = false
