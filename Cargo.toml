[workspace]

members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Andrei Tumbar"]
license = "Apache-2.0"
repository = "https://github.com/nasa/spacewasm"
rust-version = "1.87"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Casts between integer/float types are pervasive and deliberate in a Wasm
# interpreter: Wasm values are untyped bit patterns and the spec mandates
# wrapping/truncating conversions. Rewriting to `try_from`/`From` would add
# spurious error/panic paths or change semantics, so these are allowed.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_ptr_alignment = "allow"
# Reinterpreting between reference/pointer types is intrinsic to the memory and
# value machinery here.
transmute_ptr_to_ptr = "allow"
# Documentation-only lints: the `# Errors`/`# Panics` sections add churn without
# improving these internal interfaces.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Stylistic lints that fight the existing structure (locals-scoped consts, the
# large opcode dispatch loop, opcode/bitmask literals, hot inlined accessors).
items_after_statements = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
inline_always = "allow"

[package]
name = "spacewasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A no_std WebAssembly 1.0 decoder, validator, and interpreter for on-board spacecraft use"
readme = "README.md"
keywords = ["wasm", "webassembly", "interpreter", "no_std", "embedded"]
categories = ["wasm", "no-std", "embedded"]

[lints]
workspace = true

[lib]
name = "spacewasm"
path = "src/lib.rs"

[features]
default = []

# Perform a bounds check on every stack access.
# This is usually not necessary since stack accesses are already checked up-front
# by the verifier. Useful for fuzzing/regression testing
strict-assertions = []

[dependencies]
libm = "0.2.16"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spacewasm = { path = ".", features = ["strict-assertions"] }

# The C library is a `no_std` staticlib/cdylib and cannot unwind (no `std` in the
# link). `panic = "abort"` applies workspace-wide; cargo auto-overrides it back to
# unwind for `cargo test`, so integration tests are unaffected.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "thin"
debug = "full"
strip = false
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
