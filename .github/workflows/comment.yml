name: PR Comments
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  contents: read

jobs:
  comment:
    name: Post PR comments
    runs-on: ubuntu-latest
    # Only act on CI runs that were triggered by a pull request.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download CI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          # The benchmark/coverage artifacts may not both exist (e.g. one job
          # failed); tolerate missing ones instead of failing the whole run.
        continue-on-error: true

      - name: Post benchmark and coverage comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TRUSTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(process.env.TRUSTED_PR_NUMBER, 10);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              console.log('No trusted PR number on the workflow_run event; skipping comments.');
              return;
            }

            // Reads an artifact JSON file if it was downloaded, else null.
            function readResults(name) {
                const path = `artifacts/${name}/${name}.json`;
                if (!fs.existsSync(path)) {
                    console.log(`No ${name} artifact found; skipping.`);
                    return null;
                }
                return JSON.parse(fs.readFileSync(path, 'utf8'));
            }

            // Parses an artifact-supplied numeric field. Returns null for any
            // value that is not a finite number so untrusted content can never
            // reach the comment body verbatim.
            function finiteOrNull(value) {
              const n = parseFloat(value);
              return Number.isFinite(n) ? n : null;
            }

            // Creates a new comment or updates the existing bot comment that
            // contains `marker` in its body.
            async function upsertComment(prNumber, marker, body) {
                const { data: comments } = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                });

                const botComment = comments.find(c =>
                    c.user.type === 'Bot' && c.body.includes(marker)
                );

                if (botComment) {
                await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body,
                });
                } else {
                await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body,
                });
                }
            }

            // Formats a number with thousands separators, wrapped in code.
            function fmt(value, digits = 0, unit = "") {
                const s = value.toLocaleString('en-US', {
                    minimumFractionDigits: digits,
                    maximumFractionDigits: digits,
                });
                return "`" + s + "`" + unit;
            }

            // Returns the "base" and "Delta" cells comparing `value` against
            // `old`. A missing baseline is reported as a new entry.
            function compare(value, old, lower_better, digits = 0, unit = "") {
                if (old === undefined || old === null) {
                    return ["—", "new"];
                }
                const base = fmt(old, digits, unit);
                const diff = value - old;
                if (diff.toFixed(digits) == 0) {
                    return [base, "no change"];
                }
                const better = lower_better ? diff < 0 : diff > 0;
                const sign = diff > 0 ? "+" : "−";
                let delta = (better ? "🟢 " : "🔴 ") + sign + fmt(Math.abs(diff), digits, unit);
                if (old != 0) {
                    delta += " (" + sign + Math.abs(100 * diff / old).toFixed(1) + "%)";
                }
                return [base, delta];
            }

            // A single summary cell: the value followed by a short percentage
            // change against `old`, if there is one.
            function summarize(value, old, lower_better) {
                let cell = fmt(value, 0, " B");
                if (old === null || old == value) {
                    return cell;
                }
                const better = lower_better ? value < old : value > old;
                const sign = value > old ? "+" : "−";
                const pct = old == 0 ? "" : Math.abs(100 * (value - old) / old).toFixed(1) + "%";
                return cell + " " + (better ? "🟢 " : "🔴 ") + sign + pct;
            }

            // Sums the named sections, or null if any of them is missing.
            function total(sizes, names) {
                let sum = 0;
                for (let name of names) {
                    const n = finiteOrNull((sizes ?? {})[name]);
                    if (n === null) {
                        return null;
                    }
                    sum += n;
                }
                return sum;
            }

            const benchmark = readResults('benchmark-results');
            if (benchmark) {
                const data = benchmark.current;
                const old_data = benchmark.baseline;
                const nm_url = benchmark.nm_artifacts_url;

                let triples = benchmark.current.triples;
                let elf_sections = benchmark.current.elf_sections;

                // .data is stored in flash and copied into RAM at startup, so
                // it counts towards both.
                const flash_sections = [".text", ".rodata", ".data"];
                const ram_sections = [".data", ".bss"];

                let comment = "## Size Summary\n\n";
                comment += "| Target | Flash | RAM (static) | Heap |\n";
                comment += "| :-- | --: | --: | --: |\n";
                for (let triple of triples) {
                    const old = old_data[triple];
                    const heap = finiteOrNull(data[triple]["heap"]);
                    comment += "| **`"+triple+"`** | "
                        + summarize(total(data[triple], flash_sections), total(old, flash_sections), true) + " | "
                        + summarize(total(data[triple], ram_sections), total(old, ram_sections), true) + " | "
                        + (heap === null ? "-" : summarize(heap, finiteOrNull((old ?? {})["heap"]), true)) + " |\n";
                }
                comment += "\n_Flash: `.text` + `.rodata` + `.data`. RAM: `.data` + `.bss`. Heap: bytes allocated from the SpaceWasm global allocator after running coremark. The embedded wasm module and its linear memory are excluded._\n";

                comment += "\n<details><summary><i>view per-section sizes...</i></summary>\n\n";
                comment += "| Target | Section | This PR | base | Delta |\n";
                comment += "| :-- | :-- | --: | --: | --: |\n";
                for (let triple of triples) {
                    elf_sections.forEach((section_name, i) => {
                        let size = data[triple][section_name];
                        let old_size = (old_data[triple] ?? {})[section_name];
                        let target = i == 0 ? "**`"+triple+"`**" : "";
                        let [base, delta] = compare(size, old_size, true, 0, " B");
                        comment += "| "+target+" | `"+section_name+"` | "+fmt(size, 0, " B")+" | "+base+" | "+delta+" |\n";
                    });

                    // Bytes handed out by the global allocator after running
                    // coremark. Wasm linear memory is not included.
                    let heap = finiteOrNull(data[triple]["heap"]);
                    if (heap !== null) {
                        let old_heap = finiteOrNull((old_data[triple] ?? {})["heap"]);
                        let [base, delta] = compare(heap, old_heap, true, 0, " B");
                        comment += "| | heap | "+fmt(heap, 0, " B")+" | "+base+" | "+delta+" |\n";
                    }
                }
                comment += "\n</details>\n";
                comment += "\n<details><summary><i>view ELF section headers and symbol table...</i></summary>\n\n";
                comment += "<br><small>You can also download the <a href='"+nm_url+"'>full symbol tables</a>.</small>\n\n";
                for (let triple of triples) {
                    comment += "### `"+triple+"`\n";
                    comment += "```\n"+data[triple]["details"]+"\n";
                    comment += "\nSymbol Table:\n";
                    for (let symbol of data[triple]["nm"]) {
                      comment += "\t" + symbol + "\n";
                    }
                    comment += "\t...truncated (see artifact for full table)...\n```\n";
                }
                comment += "</details>\n\n";

                comment += "## Coremark Scores\n\n";
                comment += "| Target | QEMU CPU / Board | This PR | base | Delta | Host Time |\n";
                comment += "| :-- | :-- | --: | --: | --: | --: |\n";
                for (let triple of triples) {
                    let score = finiteOrNull(data[triple]["coremark"]);
                    let t = finiteOrNull(data[triple]["coremark_time"]);
                    if (score === null || t === null) {
                        comment += "| **`"+triple+"`** | "+(data[triple]["qemu_info"] ?? "")+" | ❌ failed | - | - | - |\n";
                        continue;
                    }
                    let old_score = finiteOrNull((old_data[triple] ?? {})["coremark"]);
                    let [base, delta] = compare(score, old_score, false, 2);
                    comment += "| **`"+triple+"`** | "+data[triple]["qemu_info"]+" | "+fmt(score, 2)+" | "+base+" | "+delta+" | "+t.toFixed(2)+" s |\n";
                }
                comment += "\n";

                
                await upsertComment(
                    parseInt(benchmark.prNumber, 10),
                    'Coremark Scores',
                    comment
                );
            }

            const coverage = readResults('coverage-results');
            if (coverage) {
              const currentCoverage = finiteOrNull(coverage.currentCoverage);
              const baselineCoverage = finiteOrNull(coverage.baselineCoverage);

              if (currentCoverage === null) {
                console.log('Coverage artifact has no valid currentCoverage; skipping.');
              } else {
                let comment = '## Code Coverage Report\n\n';
                comment += `**Current Coverage:** ${currentCoverage.toFixed(2)}%\n`;

                if (baselineCoverage !== null) {
                  const diff = currentCoverage - baselineCoverage;

                  comment += `**Baseline Coverage (main):** ${baselineCoverage.toFixed(2)}%\n`;
                  comment += `**Difference:** ${diff >= 0 ? '+' : ''}${diff.toFixed(2)}%\n\n`;

                  if (diff < -1.0) {
                    comment += '**Warning:** Coverage decreased by more than 1%\n';
                  } else if (diff >= 1.0) {
                    comment += '**Improvement:** Coverage increased!\n';
                  }
                } else {
                  comment += '\n_No baseline available for comparison_\n';
                }

                await upsertComment(
                  prNumber,
                  'Code Coverage Report',
                  comment
                );
              }
            }

