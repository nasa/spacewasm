name: PR Comments
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  contents: read

jobs:
  comment:
    name: Post PR comments
    runs-on: ubuntu-latest
    # Only act on CI runs that were triggered by a pull request.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download CI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          # The benchmark/coverage artifacts may not both exist (e.g. one job
          # failed); tolerate missing ones instead of failing the whole run.
        continue-on-error: true

      - name: Post benchmark and coverage comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TRUSTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(process.env.TRUSTED_PR_NUMBER, 10);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              console.log('No trusted PR number on the workflow_run event; skipping comments.');
              return;
            }

            // Reads an artifact JSON file if it was downloaded, else null.
            function readResults(name) {
                const path = `artifacts/${name}/${name}.json`;
                if (!fs.existsSync(path)) {
                    console.log(`No ${name} artifact found; skipping.`);
                    return null;
                }
                return JSON.parse(fs.readFileSync(path, 'utf8'));
            }

            // Parses an artifact-supplied numeric field. Returns null for any
            // value that is not a finite number so untrusted content can never
            // reach the comment body verbatim.
            function finiteOrNull(value) {
              const n = parseFloat(value);
              return Number.isFinite(n) ? n : null;
            }

            // Validates that a URL comes from the expected GitHub Actions
            // artifact domain. Artifact download URLs are always served from
            // github.com or objects.githubusercontent.com; anything else
            // (e.g. javascript: URIs or attacker-controlled domains) is
            // rejected to prevent URL injection via a malicious artifact.
            function safeArtifactUrl(url) {
              try {
                const parsed = new URL(String(url));
                const allowed = [
                  'github.com',
                  'objects.githubusercontent.com',
                  'pipelines.actions.githubusercontent.com',
                ];
                if (
                  (parsed.protocol === 'https:') &&
                  allowed.some(h => parsed.hostname === h || parsed.hostname.endsWith('.' + h))
                ) {
                  return parsed.href;
                }
              } catch (_) { /* invalid URL */ }
              console.log(`Rejected unsafe artifact URL: ${url}`);
              return null;
            }

            // Escapes a string for safe embedding inside a Markdown code span
            // or table cell. Strips backticks and pipe characters that would
            // otherwise break the Markdown structure, and trims to a
            // reasonable length so a malicious artifact cannot produce an
            // unboundedly large comment.
            function sanitizeMd(value, maxLen = 256) {
              return String(value)
                .replace(/[`|]/g, '')
                .replace(/[\r\n]+/g, ' ')
                .slice(0, maxLen);
            }

            // Creates a new comment or updates the existing bot comment that
            // contains `marker` in its body.
            async function upsertComment(prNumber, marker, body) {
                const { data: comments } = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                });

                const botComment = comments.find(c =>
                    c.user.type === 'Bot' && c.body.includes(marker)
                );

                if (botComment) {
                await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body,
                });
                } else {
                await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body,
                });
                }
            }

            function colorize(new_value, old, lower_better) {
                let color = "";
                let change_text = "";

                if (old != new_value) {
                    if (old == 0) {
                        pct_change = new_value > 0 ? Infinity : -Infinity;
                    } else {
                        pct_change = (100 * (new_value - old) / old).toFixed(1);
                    }
                    if (pct_change > 0) {
                        color = lower_better ? "🔴 " : "🟢 ";
                        change_text = "(⬆️ " + String(pct_change) + "% from " + String(old) + ")";
                    } else {
                        color = lower_better ? "🟢 " : "🔴 ";
                        change_text = "(⬇️ " + String(-pct_change) + "% from " + String(old) + ")";
                    }
                }
                return color + String(new_value) + "<br>" + change_text;
            }

            const benchmark = readResults('benchmark-results');
            if (benchmark) {
                const data = benchmark.current;
                const old_data = benchmark.baseline;

                // Validate nm_artifacts_url against the allowed GitHub domains
                // before embedding it in the comment HTML. A malicious artifact
                // could otherwise inject an arbitrary URL (including javascript:
                // URIs) into the <a href> attribute.
                const raw_nm_url = benchmark.nm_artifacts_url;
                const nm_url = safeArtifactUrl(raw_nm_url);

                let triples = benchmark.current.triples;
                let elf_sections = benchmark.current.elf_sections;

                let comment = "# ELF Section Sizes\n";
                // sanitizeMd guards section and triple names coming from the
                // artifact so they cannot inject Markdown table-breaking chars.
                comment += "||" + elf_sections.map(i => "`"+sanitizeMd(i)+"`").join("|") + "|\n";
                comment += "|--:|" + ":-:|".repeat(triples.length) + "\n";
                for (let triple of triples) {
                    comment += "|**`"+sanitizeMd(triple)+"`**|";
                    for (let section_name of elf_sections) {
                        let size = data[triple][section_name];
                        let old_size = (old_data[triple] ?? {})[section_name] ?? size;

                        comment += colorize(size, old_size, true) + "|";
                    }
                    comment += "\n";
                }
                comment += "\n<details><summary><i>view detailed section sizes and symbol table...</i></summary>\n\n";
                // Only embed the link if the URL passed the allowlist check.
                if (nm_url !== null) {
                  comment += "<br><small>You can also download the <a href='"+nm_url+"'>full symbol tables</a>.</small>\n\n";
                } else {
                  comment += "<br><small>Symbol table artifact URL was not available.</small>\n\n";
                }
                for (let triple of triples) {
                    comment += "### `"+sanitizeMd(triple)+"`\n";
                    comment += "```\n"+sanitizeMd(data[triple]["details"], 4096)+"\n";
                    comment += "\nSymbol Table:\n";
                    for (let symbol of data[triple]["nm"]) {
                      comment += "\t" + sanitizeMd(symbol) + "\n";
                    }
                    comment += "\t...truncated (see artifact for full table)...\n```\n";
                }
                comment += "</details>\n\n";

                comment += "# Coremark Scores\n";

                comment += "||QEMU CPU / Board|Coremark Score|Host Time|\n";
                comment += "|--:|:-:|:-:|:-:|\n";
                for (let triple of triples) {
                    let score = data[triple]["coremark"];
                    let t = finiteOrNull(data[triple]["coremark_time"]);
                    if (score === undefined || t === null) {
                        comment += "|**`"+sanitizeMd(triple)+"`**|"+(sanitizeMd(data[triple]["qemu_info"] ?? ""))+"|❌ failed|-|\n";
                        continue;
                    }
                    let old_score = (old_data[triple] ?? {})["coremark"] ?? score;
                    comment += "|**`"+sanitizeMd(triple)+"`**|"+sanitizeMd(data[triple]["qemu_info"])+"|"+colorize(score, old_score, false)+"|"+t.toFixed(2)+" s|\n";
                }
                comment += "\n";

                
                await upsertComment(
                    parseInt(benchmark.prNumber, 10),
                    'Coremark Scores',
                    comment
                );
            }

            const coverage = readResults('coverage-results');
            if (coverage) {
              const currentCoverage = finiteOrNull(coverage.currentCoverage);
              const baselineCoverage = finiteOrNull(coverage.baselineCoverage);

              if (currentCoverage === null) {
                console.log('Coverage artifact has no valid currentCoverage; skipping.');
              } else {
                let comment = '## Code Coverage Report\n\n';
                comment += `**Current Coverage:** ${currentCoverage.toFixed(2)}%\n`;

                if (baselineCoverage !== null) {
                  const diff = currentCoverage - baselineCoverage;

                  comment += `**Baseline Coverage (main):** ${baselineCoverage.toFixed(2)}%\n`;
                  comment += `**Difference:** ${diff >= 0 ? '+' : ''}${diff.toFixed(2)}%\n\n`;

                  if (diff < -1.0) {
                    comment += '**Warning:** Coverage decreased by more than 1%\n';
                  } else if (diff >= 1.0) {
                    comment += '**Improvement:** Coverage increased!\n';
                  }
                } else {
                  comment += '\n_No baseline available for comparison_\n';
                }

                await upsertComment(
                  prNumber,
                  'Code Coverage Report',
                  comment
                );
              }
            }
