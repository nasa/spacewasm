name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - os: macos-arm64
            runner: macos-14
            profile: debug
          - os: macos-arm64
            runner: macos-14
            profile: release

          # Linux x86_64
          - os: linux-x86
            runner: ubuntu-latest
            profile: debug
          - os: linux-x86
            runner: ubuntu-latest
            profile: release

          # Linux ARM64
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            profile: debug
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            profile: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          if [ "$RUNNER_OS" == "macOS" ]; then
            if [ "$RUNNER_ARCH" == "ARM64" ]; then
              WABT_PLATFORM="macos-arm64"
            else
              WABT_PLATFORM="macos-x64"
            fi
          else
            # Linux
            if [ "$RUNNER_ARCH" == "ARM64" ]; then
              WABT_PLATFORM="linux-arm64"
            else
              WABT_PLATFORM="linux-x64"
            fi
          fi
          wget https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          tar -xzf wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/
        shell: bash

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --release --verbose

      - name: Run tests with strict-assertions (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --features strict-assertions --verbose

      - name: Run tests with strict-assertions (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --release --features strict-assertions --verbose

  test-32bit:
    name: Test (i686-unknown-linux-gnu, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - debug
          - release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 32-bit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          wget https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-linux-x64.tar.gz
          tar -xzf wabt-${WABT_VERSION}-linux-x64.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/
        shell: bash

      # Only the interpreter library is deployed to the 32-bit target, so the
      # host-only workspace tooling is not built here. Running the suite on a
      # 32-bit `usize` guards pointer-width regressions (e.g. memory
      # effective-address overflow) that the 64-bit test matrix cannot observe.
      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test -p spacewasm --target i686-unknown-linux-gnu --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test -p spacewasm --release --target i686-unknown-linux-gnu --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check C header codegen is up to date
        run: |
          # Regenerate include/spacewasm.h from the Rust source. The build
          # script writes the header in place when the `codegen` feature is on.
          cargo build -p spacewasm_c_api --features codegen
          # Fail if the regenerated header differs from what is tracked in git.
          if ! git diff --exit-code -- crates/spacewasm_c_api/include/spacewasm.h; then
            echo "::error::spacewasm.h is out of date. Run 'cargo build -p spacewasm_c_api --features codegen' and commit the result."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-arm64
            runner: macos-14
          - os: linux-x86
            runner: ubuntu-latest
          - os: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build all targets
        run: cargo build --workspace --all-targets --verbose

      - name: Build release
        run: cargo build --workspace --release --verbose

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # How many times each side is timed. The reported figure is the median, so
      # a single unlucky run no longer decides the result. Kept low because the
      # instruction count below, not the score, is what resolves small changes.
      BENCH_SAMPLES: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          WABT_PLATFORM="linux-x64"
          wget https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          tar -xzf wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/

      - name: Install Valgrind
        # Counts the instructions each side executes. Hardware counters are not
        # an option here: GitHub runners are Azure VMs whose hypervisor does not
        # expose the PMU, so perf reports hardware events as unsupported.
        # Valgrind needs none, being pure user-space instrumentation.
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends valgrind

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Build benchmark binaries
        run: |
          set -euo pipefail

          # Stage the bench binary next to the wasm it loads, so a side can be
          # re-run later without checking its revision back out.
          stage() {
            local dest="$1"
            local exe
            exe=$(cargo bench -p spacewasm_std --bench coremark --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact")
                       | select(.target.kind | index("bench"))
                       | select(.target.name == "coremark")
                       | .executable' \
              | tail -n 1)
            if [ -z "$exe" ] || [ ! -x "$exe" ]; then
              echo "Could not locate the CoreMark benchmark executable"
              return 1
            fi
            mkdir -p "$dest/benches"
            cp "$exe" "$dest/coremark"
            cp crates/spacewasm_std/benches/coremark-minimal.wasm "$dest/benches/"
          }

          # Keep the measurement harness and workload identical for both builds.
          # The baseline must vary only the implementation under measurement;
          # otherwise older main branches cannot pin the workload and the two
          # instruction counts are not comparable.
          harness="$RUNNER_TEMP/coremark-harness"
          mkdir -p "$harness"
          cp crates/spacewasm_std/benches/coremark.rs "$harness/"
          cp crates/spacewasm_std/benches/coremark-minimal.wasm "$harness/"

          stage "$RUNNER_TEMP/pr"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            head=$(git rev-parse HEAD)
            git fetch --no-tags origin main
            git checkout --detach FETCH_HEAD
            cp "$harness/coremark.rs" crates/spacewasm_std/benches/coremark.rs
            cp "$harness/coremark-minimal.wasm" \
              crates/spacewasm_std/benches/coremark-minimal.wasm
            stage "$RUNNER_TEMP/base"
            git restore --source=HEAD -- \
              crates/spacewasm_std/benches/coremark.rs \
              crates/spacewasm_std/benches/coremark-minimal.wasm
            git checkout --detach "$head"
          fi

      - name: Count instructions
        id: instructions
        run: |
          set -euo pipefail

          # Callgrind instruction counts do not depend on the runner's CPU model,
          # its neighbours, or the hypervisor. With the same harness and pinned
          # workload on both sides, they provide a repeatable work proxy for the
          # implementation change.
          #
          # COREMARK_FIXED_CLOCK is what makes the two counts comparable:
          # without it the module sizes its own workload from wall-clock time,
          # in steps of nearly 2x, and the count would describe the runner
          # rather than the build.
          sides=(pr)
          if [ -x "$RUNNER_TEMP/base/coremark" ]; then
            sides+=(base)
          fi

          # A pinned run scores exactly 10.000 and takes a fraction of a second.
          # Fail before Callgrind if either binary does not execute that known
          # workload; comparing counts from different workloads would be invalid.
          for side in "${sides[@]}"; do
            log="$RUNNER_TEMP/$side.pin.log"
            if ! ( cd "$RUNNER_TEMP/$side" && COREMARK_FIXED_CLOCK=1 ./coremark ) > "$log" 2>&1 \
              || ! grep -q '^CoreMark Score: 10.000$' "$log"; then
              cat "$log"
              echo "The $side benchmark did not produce the pinned workload"
              exit 1
            fi
          done

          for side in "${sides[@]}"; do
            out="$RUNNER_TEMP/callgrind.$side"
            log="$RUNNER_TEMP/$side.count.log"

            if ! (
              cd "$RUNNER_TEMP/$side"
              COREMARK_FIXED_CLOCK=1 valgrind --tool=callgrind \
                --cache-sim=no --branch-sim=no \
                --callgrind-out-file="$out" ./coremark
            ) > "$log" 2>&1; then
              cat "$log"
              echo "Failed to count instructions for $side"
              exit 1
            fi

            # Whole-process total, so parsing and compiling the module count as
            # well as interpreting it. Ir is the only event collected here, so
            # the summary carries a single figure.
            ir=$(awk '/^(summary|totals):/ { print $2; exit }' "$out")
            if ! [[ "$ir" =~ ^[0-9]+$ ]]; then
              cat "$log"
              echo "No instruction count in $out"
              exit 1
            fi

            if [ "$side" = pr ]; then
              echo "instructions=$ir" >> "$GITHUB_OUTPUT"
              echo "Instructions: $ir"
            else
              echo "baseline_instructions=$ir" >> "$GITHUB_OUTPUT"
              echo "Baseline instructions: $ir"
            fi
          done

      - name: Run CoreMark benchmark
        id: benchmark
        run: |
          set -euo pipefail

          run_once() {
            ( cd "$1" && ./coremark ) | awk '/CoreMark Score:/ { print $3 }'
          }

          summarize() {
            sort -g "$1" | awk '
              { v[NR] = $1 }
              END {
                median = (NR % 2) ? v[(NR + 1) / 2] : (v[NR / 2] + v[NR / 2 + 1]) / 2
                printf "%.3f %.3f %.3f", median, v[1], v[NR]
              }'
          }

          sides=(pr)
          : > "$RUNNER_TEMP/pr.scores"
          if [ -x "$RUNNER_TEMP/base/coremark" ]; then
            sides+=(base)
            : > "$RUNNER_TEMP/base.scores"
          fi

          for i in $(seq 1 "$BENCH_SAMPLES"); do
            # Swap the order on every other sample. Measuring one side first
            # every time hands it a systematically different machine state.
            order=("${sides[@]}")
            if [ "${#sides[@]}" -eq 2 ] && [ $((i % 2)) -eq 0 ]; then
              order=(base pr)
            fi

            for side in "${order[@]}"; do
              score=$(run_once "$RUNNER_TEMP/$side")
              if [ -z "$score" ]; then
                echo "Failed to extract CoreMark score for $side"
                exit 1
              fi
              echo "$score" >> "$RUNNER_TEMP/$side.scores"
              echo "sample $i ($side): $score"
            done
          done

          read -r score min max <<< "$(summarize "$RUNNER_TEMP/pr.scores")"
          {
            echo "samples=$BENCH_SAMPLES"
            echo "score=$score"
            echo "min=$min"
            echo "max=$max"
          } >> "$GITHUB_OUTPUT"
          echo "Benchmark score: $score (range $min-$max over $BENCH_SAMPLES samples)"

          if [ -s "${RUNNER_TEMP}/base.scores" ]; then
            read -r baseline baseline_min baseline_max <<< "$(summarize "$RUNNER_TEMP/base.scores")"
            {
              echo "baseline=$baseline"
              echo "baseline_min=$baseline_min"
              echo "baseline_max=$baseline_max"
            } >> "$GITHUB_OUTPUT"
            echo "Baseline score: $baseline (range $baseline_min-$baseline_max over $BENCH_SAMPLES samples)"
          else
            echo "baseline=" >> "$GITHUB_OUTPUT"
          fi

      - name: Save benchmark results
        if: github.event_name == 'pull_request'
        run: |
          cat > benchmark-results.json <<EOF
          {
            "prNumber": "${{ github.event.pull_request.number }}",
            "currentInstructions": "${{ steps.instructions.outputs.instructions }}",
            "baselineInstructions": "${{ steps.instructions.outputs.baseline_instructions }}",
            "samples": "${{ steps.benchmark.outputs.samples }}",
            "currentScore": "${{ steps.benchmark.outputs.score }}",
            "currentMin": "${{ steps.benchmark.outputs.min }}",
            "currentMax": "${{ steps.benchmark.outputs.max }}",
            "baselineScore": "${{ steps.benchmark.outputs.baseline }}",
            "baselineMin": "${{ steps.benchmark.outputs.baseline_min }}",
            "baselineMax": "${{ steps.benchmark.outputs.baseline_max }}"
          }
          EOF

      - name: Upload benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  model-checking:
    name: Formal Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Run Kani on repo'
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '-j --output-format=terse'

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          WABT_PLATFORM="linux-x64"
          wget https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          tar -xzf wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Generate coverage
        run: |
          # Cover the main library and the C-API layer. spacewasm_c_api's Rust
          # `#[cfg(test)]` suite drives the `spacewasm_*` entry points directly,
          # so its coverage is attributed like any other crate.
          cargo llvm-cov \
            --package spacewasm \
            --package spacewasm_c_api \
            --lcov --output-path lcov.info
          cargo llvm-cov \
            --package spacewasm \
            --package spacewasm_c_api \
            --json --output-path coverage.json

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage percentage from JSON output
          coverage=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          echo "percentage=$coverage" >> $GITHUB_OUTPUT
          echo "Current coverage: $coverage%"

      - name: Download baseline coverage
        id: baseline-coverage
        continue-on-error: true
        run: |
          # Try to get baseline from main branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin main:main
            git checkout main
            cargo llvm-cov \
              --package spacewasm \
              --package spacewasm_c_api \
              --json --output-path baseline-coverage.json 2>&1 || true
            git checkout -

            if [ -f baseline-coverage.json ]; then
              baseline=$(jq -r '.data[0].totals.lines.percent' baseline-coverage.json)
              echo "baseline=$baseline" >> $GITHUB_OUTPUT
              echo "Baseline coverage: $baseline%"
            else
              echo "baseline=" >> $GITHUB_OUTPUT
            fi
          else
            echo "baseline=" >> $GITHUB_OUTPUT
          fi

      - name: Save coverage results
        if: github.event_name == 'pull_request'
        run: |
          cat > coverage-results.json <<EOF
          {
            "prNumber": "${{ github.event.pull_request.number }}",
            "currentCoverage": "${{ steps.coverage.outputs.percentage }}",
            "baselineCoverage": "${{ steps.baseline-coverage.outputs.baseline }}"
          }
          EOF

      - name: Upload coverage results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: coverage-results.json

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
