name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - os: macos-arm64
            runner: macos-14
            profile: debug
          - os: macos-arm64
            runner: macos-14
            profile: release

          # Linux x86_64
          - os: linux-x86
            runner: ubuntu-latest
            profile: debug
          - os: linux-x86
            runner: ubuntu-latest
            profile: release

          # Linux ARM64
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            profile: debug
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            profile: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          if [ "$RUNNER_OS" == "macOS" ]; then
            if [ "$RUNNER_ARCH" == "ARM64" ]; then
              WABT_PLATFORM="macos-arm64"
            else
              WABT_PLATFORM="macos-x64"
            fi
          else
            # Linux
            if [ "$RUNNER_ARCH" == "ARM64" ]; then
              WABT_PLATFORM="linux-arm64"
            else
              WABT_PLATFORM="linux-x64"
            fi
          fi
          wget https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          tar -xzf wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/
        shell: bash

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --release --verbose

      - name: Run tests with strict-assertions (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --features strict-assertions --verbose

      - name: Run tests with strict-assertions (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --release --features strict-assertions --verbose

  test-32bit:
    name: Test (i686-unknown-linux-gnu, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - debug
          - release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 32-bit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          wget https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-linux-x64.tar.gz
          tar -xzf wabt-${WABT_VERSION}-linux-x64.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/
        shell: bash

      # Only the interpreter library is deployed to the 32-bit target, so the
      # host-only workspace tooling is not built here. Running the suite on a
      # 32-bit `usize` guards pointer-width regressions (e.g. memory
      # effective-address overflow) that the 64-bit test matrix cannot observe.
      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test -p spacewasm --target i686-unknown-linux-gnu --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test -p spacewasm --release --target i686-unknown-linux-gnu --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check C header codegen is up to date
        run: |
          # Regenerate include/spacewasm.h from the Rust source. The build
          # script writes the header in place when the `codegen` feature is on.
          cargo build -p spacewasm_c_api --features codegen
          # Fail if the regenerated header differs from what is tracked in git.
          if ! git diff --exit-code -- crates/spacewasm_c_api/include/spacewasm.h; then
            echo "::error::spacewasm.h is out of date. Run 'cargo build -p spacewasm_c_api --features codegen' and commit the result."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-arm64
            runner: macos-14
          - os: linux-x86
            runner: ubuntu-latest
          - os: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build all targets
        run: cargo build --workspace --all-targets --verbose

      - name: Build release
        run: cargo build --workspace --release --verbose

  benchmark:
    name: Benchmark
    # The ARM runners expose the CPU's performance counters; the x86 ones do
    # not, being Azure VMs whose hypervisor hides the PMU. That is what decides
    # the runner here, since it is the difference between reading the
    # instruction count off the hardware and simulating the program to get it.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Build benchmark binaries
        run: |
          set -euo pipefail

          # Stage the bench binary next to the wasm it loads, so a side can be
          # re-run later without checking its revision back out.
          stage() {
            local dest="$1"
            local exe
            exe=$(cargo bench -p spacewasm_std --bench coremark --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact")
                       | select(.target.kind | index("bench"))
                       | select(.target.name == "coremark")
                       | .executable' \
              | tail -n 1)
            if [ -z "$exe" ] || [ ! -x "$exe" ]; then
              echo "Could not locate the CoreMark benchmark executable"
              return 1
            fi
            mkdir -p "$dest/benches"
            cp "$exe" "$dest/coremark"
            cp crates/spacewasm_std/benches/coremark-minimal.wasm "$dest/benches/"
          }

          # Keep the measurement harness and workload identical for both builds.
          # The baseline must vary only the implementation under measurement;
          # otherwise older main branches cannot pin the workload and the two
          # instruction counts are not comparable.
          harness="$RUNNER_TEMP/coremark-harness"
          mkdir -p "$harness"
          cp crates/spacewasm_std/benches/coremark.rs "$harness/"
          cp crates/spacewasm_std/benches/coremark-minimal.wasm "$harness/"

          stage "$RUNNER_TEMP/pr"

          # The baseline stays best effort. A harness written against an
          # interface main does not have yet will not build there, and a PR
          # should still get a score of its own when that happens.
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            head=$(git rev-parse HEAD)
            if git fetch --no-tags origin main && git checkout --detach FETCH_HEAD; then
              cp "$harness/coremark.rs" crates/spacewasm_std/benches/coremark.rs
              cp "$harness/coremark-minimal.wasm" \
                crates/spacewasm_std/benches/coremark-minimal.wasm
              stage "$RUNNER_TEMP/base" \
                || echo "::warning::could not build the baseline against this branch's harness"
              git restore --source=HEAD -- \
                crates/spacewasm_std/benches/coremark.rs \
                crates/spacewasm_std/benches/coremark-minimal.wasm
              git checkout --detach "$head"
            else
              echo "::warning::could not check out main to build a baseline"
            fi
          fi

      - name: Count instructions
        id: instructions
        run: |
          set -euo pipefail

          # How many instructions each side executes, read off the CPU's own
          # counter. Unlike the score below it does not move with the runner's
          # CPU model or with whoever else is on the machine, so a difference in
          # it is work this PR added or removed.
          #
          # The image ships perf_event_paranoid=4, which refuses even to count a
          # process this job started itself.
          sudo sysctl -w kernel.perf_event_paranoid=1

          # If the counter ever goes away, say so and leave the timed
          # comparison to stand rather than failing a PR over it.
          probe=$(perf stat -e instructions:u true 2>&1 || true)
          if ! grep -q 'instructions:u' <<< "$probe" || grep -q 'not supported' <<< "$probe"; then
            echo "$probe"
            echo "::warning::no hardware instruction counter on this runner; skipping instruction counts"
            exit 0
          fi

          sides=(pr)
          if [ -x "$RUNNER_TEMP/base/coremark" ]; then
            sides+=(base)
          fi

          for side in "${sides[@]}"; do
            stats="$RUNNER_TEMP/$side.perf"
            log="$RUNNER_TEMP/$side.count.log"

            # COREMARK_FIXED_CLOCK is what makes the two counts comparable:
            # without it the module sizes its own workload from wall-clock time,
            # in steps of nearly 2x, and the count would describe the runner
            # rather than the build. A pinned run scores exactly 10.000, so the
            # score doubles as a check that the count came from that workload.
            #
            # A pr side that cannot pin is this branch's own doing and fails the
            # job. A baseline that cannot pin is not, so the counts are skipped
            # and the timed comparison stands.
            if ! (
              cd "$RUNNER_TEMP/$side"
              COREMARK_FIXED_CLOCK=1 perf stat -x, -e instructions:u \
                -o "$stats" ./coremark
            ) > "$log" 2>&1 || ! grep -q '^CoreMark Score: 10.000$' "$log"; then
              cat "$log"
              if [ "$side" = pr ]; then
                echo "The pr benchmark did not produce the pinned workload"
                exit 1
              fi
              echo "::warning::the baseline did not produce a pinned run; skipping instruction counts"
              exit 0
            fi

            # User space only, so kernel work done on the runner's behalf stays
            # out of the figure. Everything the process itself does is in it,
            # parsing and compiling the module as well as interpreting it.
            ir=$(awk -F, '$3 == "instructions:u" { print $1 }' "$stats")
            if ! [[ "$ir" =~ ^[0-9]+$ ]]; then
              cat "$stats"
              echo "No instruction count for $side"
              exit 1
            fi

            if [ "$side" = pr ]; then
              echo "instructions=$ir" >> "$GITHUB_OUTPUT"
              echo "Instructions: $ir"
            else
              echo "baseline_instructions=$ir" >> "$GITHUB_OUTPUT"
              echo "Baseline instructions: $ir"
            fi
          done

      - name: Run CoreMark benchmark
        id: benchmark
        run: |
          set -euo pipefail

          # One run each. The score is a figure in units people care about, but
          # it is worth a few percent either way on a shared runner, so it is
          # the count above that a regression is read out of. Timing it
          # repeatedly would not change that.
          run_once() {
            local score
            score=$( cd "$1" && ./coremark ) || return 1
            score=$(awk '/CoreMark Score:/ { print $3 }' <<< "$score")
            if [ -z "$score" ]; then
              echo "Failed to extract CoreMark score for $1" >&2
              return 1
            fi
            echo "$score"
          }

          score=$(run_once "$RUNNER_TEMP/pr")
          echo "score=$score" >> "$GITHUB_OUTPUT"
          echo "Benchmark score: $score"

          if [ -x "$RUNNER_TEMP/base/coremark" ]; then
            baseline=$(run_once "$RUNNER_TEMP/base")
            echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
            echo "Baseline score: $baseline"
          else
            echo "baseline=" >> "$GITHUB_OUTPUT"
          fi

      - name: Save benchmark results
        if: github.event_name == 'pull_request'
        run: |
          cat > benchmark-results.json <<EOF
          {
            "prNumber": "${{ github.event.pull_request.number }}",
            "currentInstructions": "${{ steps.instructions.outputs.instructions }}",
            "baselineInstructions": "${{ steps.instructions.outputs.baseline_instructions }}",
            "currentScore": "${{ steps.benchmark.outputs.score }}",
            "baselineScore": "${{ steps.benchmark.outputs.baseline }}"
          }
          EOF

      - name: Upload benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  model-checking:
    name: Formal Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Kani on repo
        uses: model-checking/kani-github-action@v1.1
        with:
          args: '-j --output-format=terse'

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
          components: miri

      - name: Run Miri
        run: cargo miri test -j4 --no-fail-fast --verbose

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          WABT_PLATFORM="linux-x64"
          wget https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          tar -xzf wabt-${WABT_VERSION}-${WABT_PLATFORM}.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Generate coverage
        run: |
          # Cover the main library and the C-API layer. spacewasm_c_api's Rust
          # `#[cfg(test)]` suite drives the `spacewasm_*` entry points directly,
          # so its coverage is attributed like any other crate.
          cargo llvm-cov \
            --package spacewasm \
            --package spacewasm_c_api \
            --lcov --output-path lcov.info
          cargo llvm-cov \
            --package spacewasm \
            --package spacewasm_c_api \
            --json --output-path coverage.json

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage percentage from JSON output
          coverage=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          echo "percentage=$coverage" >> $GITHUB_OUTPUT
          echo "Current coverage: $coverage%"

      - name: Download baseline coverage
        id: baseline-coverage
        continue-on-error: true
        run: |
          # Try to get baseline from main branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin main:main
            git checkout main
            cargo llvm-cov \
              --package spacewasm \
              --package spacewasm_c_api \
              --json --output-path baseline-coverage.json 2>&1 || true
            git checkout -

            if [ -f baseline-coverage.json ]; then
              baseline=$(jq -r '.data[0].totals.lines.percent' baseline-coverage.json)
              echo "baseline=$baseline" >> $GITHUB_OUTPUT
              echo "Baseline coverage: $baseline%"
            else
              echo "baseline=" >> $GITHUB_OUTPUT
            fi
          else
            echo "baseline=" >> $GITHUB_OUTPUT
          fi

      - name: Save coverage results
        if: github.event_name == 'pull_request'
        run: |
          cat > coverage-results.json <<EOF
          {
            "prNumber": "${{ github.event.pull_request.number }}",
            "currentCoverage": "${{ steps.coverage.outputs.percentage }}",
            "baselineCoverage": "${{ steps.baseline-coverage.outputs.baseline }}"
          }
          EOF

      - name: Upload coverage results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: coverage-results.json

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
