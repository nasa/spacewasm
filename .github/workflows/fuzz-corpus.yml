name: Nightly Fuzzing

on:
  schedule:
    # 10:17 UTC is 2:17 AM PST / 3:17 AM PDT, when the org's runners are
    # mostly idle. Cron is always UTC, so it shifts an hour with daylight
    # saving time but stays inside the 2-4 AM Pacific window.
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Grows the shared fuzzing corpus. The `fuzz-corpus` draft release (see
  # .github/scripts/fuzz-corpus.sh) is merged with the cached corpus, fuzzed
  # further, minimized and written back to both: the release is the durable
  # copy, the cache is the fast one the CI `fuzz` job restores. Running nightly
  # also keeps the cache from being evicted (7 days unused).
  fuzz-corpus:
    name: Fuzz corpus (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      # Reads and replaces the draft release's assets.
      contents: write
    # A manual run overlapping the scheduled one would race on the upload.
    concurrency:
      group: fuzz-corpus-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate
          - validate-differential
          - no-traps
          - malformed
          - exec-differential
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-30

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz

      # Restore-only: the CI `fuzz` job owns this shared cache.
      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: fuzz
          shared-key: fuzz
          save-if: false
          cache-bin: false

      - name: Build fuzzer
        run: cargo +nightly-2026-08-30 fuzz build ${{ matrix.target }}

      - name: Restore cached corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Merge pushed corpus
        env:
          GH_TOKEN: ${{ github.token }}
          FUZZ_TOOLCHAIN: nightly-2026-08-30
        run: .github/scripts/fuzz-corpus.sh pull ${{ matrix.target }}

      - name: Run fuzzer (30m)
        run: cargo +nightly-2026-08-30 fuzz run ${{ matrix.target }} -- -max_total_time=1800

      # Pulls again first, so inputs pushed by a developer during this run are
      # kept, then minimizes and replaces the release asset.
      - name: Minimize and push corpus
        env:
          GH_TOKEN: ${{ github.token }}
          FUZZ_TOOLCHAIN: nightly-2026-08-30
        run: .github/scripts/fuzz-corpus.sh push ${{ matrix.target }}

      - name: Save corpus
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
